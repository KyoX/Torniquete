name: torniquete
description: "Control de la jornada laboral: marca la entrada, las pausas y la salida, lleva el banco de horas frente a tu meta diaria y exporta los reportes."
# App privada: esta línea evita publicarla sin querer con `flutter pub publish`.
publish_to: 'none'

# Alimenta el versionName y el versionCode del APK (android/app/build.gradle.kts).
# Del build number solo se sirven las compilaciones locales: los APK que publica
# el workflow salen con --build-number=<run_number>, que siempre va por delante.
version: 1.1.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Traduce al español los diálogos que trae Material (calendario, reloj).
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Datos: la jornada vive en SQLite y los ajustes en preferencias.
  sqflite: ^2.4.1
  shared_preferences: ^2.3.3
  path: ^1.9.0

  # Fechas y horas en español, y la zona horaria real del teléfono: sin ella
  # los recordatorios a una hora fija del día se programan en el momento
  # equivocado.
  intl: ^0.20.1
  timezone: ^0.10.0
  flutter_timezone: ^5.1.0

  # Avisos: recordatorios de marca y de salida.
  flutter_local_notifications: ^19.0.0

  # Estado compartido entre pantallas y widget de inicio.
  provider: ^6.1.2
  home_widget: ^0.9.3

  # Ubicación: la sede de trabajo, la evidencia de dónde se marcó y el mapa
  # al que se abre esa evidencia. La geocerca en sí es nativa (Kotlin).
  geolocator: ^14.0.3
  url_launcher: ^6.3.2

  # Reportes y respaldos: se generan en PDF o Excel, se guardan en el
  # almacenamiento de la app y se comparten desde ahí.
  pdf: ^3.12.0
  excel: ^4.0.6
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Reglas de análisis; se configuran en analysis_options.yaml.
  flutter_lints: ^6.0.0

  # SQLite de escritorio: deja correr las pruebas de migración de la base sin
  # un emulador de por medio.
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true

  assets:
    # Hoy solo se pinta logo_mark (dashboard y onboarding); logo_full queda
    # declarado porque es el mismo logo con el nombre, para cuando haga falta.
    - assets/images/logo_full.png
    - assets/images/logo_mark.png
